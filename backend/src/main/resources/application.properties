spring.application.name=bloodbridge-backend
server.port=8080

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Database Default (Dev Profile - H2 in PostgreSQL Mode for zero-config local run)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bloodbridgedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Flyway Migrations
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration
bloodbridge.jwt.secret=${JWT_SECRET:4c8b91a7836d542e8f1b90c37e6a5d4f3b2c1e0a9d8f7e6c5b4a392817263544}
bloodbridge.jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:900000}
bloodbridge.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Rate Limiting
bloodbridge.security.rate-limit.requests-per-minute=120
bloodbridge.security.rate-limit.auth-requests-per-minute=15

# Notifications Configuration
bloodbridge.notifications.email.enabled=${EMAIL_ENABLED:true}
bloodbridge.notifications.email.mock=${EMAIL_MOCK:true}
bloodbridge.notifications.sms.enabled=${SMS_ENABLED:true}
bloodbridge.notifications.sms.provider=${SMS_PROVIDER:LOGGING}
bloodbridge.notifications.whatsapp.base-url=https://wa.me/

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.in.bloodbridge=INFO
logging.level.org.springframework.security=WARN
