version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bloodbridge-db
    environment:
      POSTGRES_DB: bloodbridge
      POSTGRES_USER: bloodbridge
      POSTGRES_PASSWORD: bloodbridge_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodbridge -d bloodbridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodbridge-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bloodbridge
      SPRING_DATASOURCE_USERNAME: bloodbridge
      SPRING_DATASOURCE_PASSWORD: bloodbridge_secure_password_2026
      JWT_SECRET: c2VjdXJlX2Jsb29kYnJpZGdlX2p3dF9zZWNyZXRfa2V5XzIwMjZfc3VwZXJfc2VjdXJlXzI1Nl9iaXRzX2xvbmc=
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      SMS_PROVIDER: logging
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - hospital_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bloodbridge-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
  hospital_uploads:
